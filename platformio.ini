; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = sparkfun_esp32s3_thing_plus

[env:sparkfun_esp32s3_thing_plus]
platform = https://github.com/pioarduino/platform-espressif32.git#develop
board = sparkfun_esp32s3_thing_plus
framework = arduino
board_build.partitions = no_ota.csv
board_build.filesystem = spiffs

upload_speed = 921600
build_flags =
	-D ARDUINO_USB_MODE=1
	
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=5
lib_ldf_mode=deep
lib_deps =
	;WiFiManager@^2.0.16-rc.2
	ESP32Async/ESPAsyncWebServer@3.7.1
	bblanchon/ArduinoJson@7.2.1
	https://github.com/thijse/Arduino-Log.git#3f4fcf5a345c1d542e56b88c0ffcb2bd2a5b0bd0
	https://github.com/bitbank2/PNGdec.git#53eea10f6a04bceadec3f57b1c3a9cd5c3cb40d7
	td-er/SparkFun MAX1704x Fuel Gauge Arduino Library@^1.0.1

debug_tool = esp-builtin
debug_init_break = break setupy
build_type = debug      ;build in debug mode instead of release mode
check_tool = clangtidy
check_flags =
  clangtidy: --checks=bugprone-*,portability-*,clang-analyzer-*,google-*,-google-readability-*
monitor_filters = esp32_exception_decoder
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
lib_deps = 
	bblanchon/ArduinoJson@7.2.1
	fabiobatsilva/ArduinoFake@^0.4.0
build_flags = 
	-D ARDUINOJSON_ENABLE_ARDUINO_STRING=1
	-std=gnu++11
	# avoids errors about WProgram.h from ArduinoLog:
	-D ARDUINO=111
	# warnings from ArduinoFake w/ MacOS' g++:
	-Wno-missing-template-arg-list-after-template-kw
lib_compat_mode = off
monitor_filters = esp32_exception_decoder
